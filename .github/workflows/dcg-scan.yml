name: DCG Scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install dcg
        run: |
          curl -fsSL https://raw.githubusercontent.com/Dicklesworthstone/destructive_command_guard/v0.5.7/install.sh \
            | bash -s -- --version v0.5.7 --dest "$HOME/.local/bin" --no-configure --verify
      - name: Scan scripts and workflows
        run: "$HOME/.local/bin/dcg" scan --paths skills/ .github/workflows/ --fail-on error
